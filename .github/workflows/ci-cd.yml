name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: diaspora
          POSTGRES_PASSWORD: diaspora_secret
          POSTGRES_DB: diasporacircle_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Setup backend environment
        run: |
          cat > packages/backend/.env.test << EOF
          NODE_ENV=test
          DATABASE_URL=postgresql://diaspora:diaspora_secret@localhost:5432/diasporacircle_test
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=test_secret_key_for_ci
          STELLAR_NETWORK=testnet
          BACKEND_PUBLIC_KEY=GXXXXXX
          BACKEND_SECRET_KEY=SXXXXXX
          EOF
      
      - name: Run backend tests
        run: pnpm --filter backend run test
      
      - name: Run frontend tests
        run: pnpm --filter frontend run test
      
      - name: Lint backend
        run: pnpm --filter backend run lint
      
      - name: Lint frontend
        run: pnpm --filter frontend run lint
      
      - name: Build backend
        run: pnpm --filter backend run build
      
      - name: Build frontend
        run: pnpm --filter frontend run build

  contract-test:
    name: Contract Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Test contracts
        run: |
          cd packages/contracts/circle
          cargo test --lib
          cd ../reputation
          cargo test --lib

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, contract-test]
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy backend to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Deploy to Railway staging environment
          echo "Deploying backend to staging..."
          # railway deploy --service backend
      
      - name: Deploy frontend to staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deploy to Vercel preview
          echo "Deploying frontend to staging..."
          # vercel deploy --token=$VERCEL_TOKEN --target=preview

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, contract-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy backend to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying backend to production..."
          # railway deploy --service backend --environment production
      
      - name: Deploy frontend to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying frontend to production..."
          # vercel deploy --token=$VERCEL_TOKEN --prod
